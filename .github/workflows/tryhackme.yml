name: Update TryHackMe Badge

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Updates automatically every day at midnight
  workflow_dispatch:     # Allows you to trigger it manually right now

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download latest TryHackMe badge
        run: |
          curl -s "https://tryhackme-badges.s3.amazonaws.com/m7mdleaf.png" -o assets/thm_badge.png

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/thm_badge.png
          git diff-index --quiet HEAD || git commit -m "Automated update of TryHackMe badge"
          git push
